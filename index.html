<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <!-- Bootstrap  -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous">
         <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
    crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>   
    <h1>My Interactive Dashboard</h1>

    <p>This dashboard was created by Kjai for the WEB-115 course at Wake Tech</p>

    <script>document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.")</script>

    <!-- The <noscript> is for web browsers with JavaScript rendering disabled. -->
    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>

     <div class="container">
    <div class="row">
        <div class="col" id="weekly-tasks">
            <script src="js/task-manager.js" defer></script>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name">

                <label for="daily-goal">Daily Task Goal:</label>
                <input type="number" id="daily-goal">

                <label for="bonus-tasks">Weekly Bonus Tasks:</label>
                <input type="number" id="bonus-tasks">

                <button id="goal-btn">Set Goals</button>
            </form>

            <p id="goal-message"></p>

            <div class ="col" id="metric-converter">

                <form id="metric-form">
                    
                    <label for="value">Enter Value:</label>
                    <input type="number" id="value" name="value">

                    <label for="conversion">Select Conversion:</label>

                    <select id="conversion" name="conversion">
                        <option value="1">Inches to Centimeters</option>
                        <option value="2">Centimeters to Inches</option>
                        <option value="3">Feet to Meters</option>
                        <option value="4">Meters to Feet</option>
                        <option value="5">Yards to Meters</option>
                        <option value="6">Meters to Yards</option>
                        <option value="7">Miles to Kilometers</option>
                        <option value="8">Kilometers to Miles</option>   
                    </select>

                    <button type="submit">Convert</button>

                </form>
                
                <p id="conversion-result"></p>

                <script src="js/metric-converter.js" defer></script>

            </div>
        </div>

        <div class="col" id="magic-eight-ball">
            <script src="js/magic-eight-ball.js" defer></script>
            <link rel="stylesheet" href="css/magic-eight-ball.css">
            <h2 class="heading">Magic Eight Ball</h2>
             <form>
                <p>Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>
                <input id="question" name="question" size="80">
                <div id="magicEightBall">
                    <div id="circle"></div>
                    <img id="ball" src="img/magic-eight-ball.png"/>
                </div>
                <button id="reset" name="reset" type="reset">Ask another question</button>
             </form>
             <br>
        </div>
        <!-- Dashboard Content -->
    </div>
</div>
</body>
</html>
